name: on-pull-request

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # サプライチェーン攻撃の検知に向けた計測(analyze モード)。
      # syscall を capture して falco-analyze ジョブで通信先・プロセスを可視化する。
      # 検知しても fail させない。
      - name: Start Falco
        uses: falcosecurity/falco-actions/start@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          mode: analyze
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check
        # $/ 記法は actionlint(v1.7.12)が構文エラーにするため ./ のままにする
        uses: ./.github/actions/gradle-action # zizmor: ignore[self-repository]
        with:
          command: check

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 7
      - name: Stop Falco
        if: always()
        uses: falcosecurity/falco-actions/stop@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          mode: analyze

  # capture を解析して、ジョブ中の通信先 / DNS / プロセスをジョブサマリに出す。
  # 収集が目的のため、検知があっても fail させない。
  falco-analyze:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 計測が目的のジョブなので、capture が無い等で失敗しても CI をブロックしない
    continue-on-error: true
    permissions:
      contents: read
      actions: read

    steps:
      - name: Analyze
        uses: falcosecurity/falco-actions/analyze@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
