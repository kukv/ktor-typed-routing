name: Gradle Action
description: Sets up Java and Gradle, then runs a Gradle command

inputs:
  command:
    description: Gradle command to execute
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: corretto
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Run Gradle command
      shell: bash
      env:
        GRADLE_COMMAND: ${{ inputs.command }}
      run: |
        chmod +x ./gradlew
        # 複数タスクを空白区切りで受け取るため意図的にクォートしない
        # shellcheck disable=SC2086
        ./gradlew $GRADLE_COMMAND
