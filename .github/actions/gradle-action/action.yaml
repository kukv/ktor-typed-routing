name: Gradle Action
description: Sets up Java and Gradle, then runs a Gradle command

inputs:
  command:
    description: Gradle command to execute
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: corretto
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Run Gradle command
      shell: bash
      env:
        GRADLE_COMMAND: ${{ inputs.command }}
      run: |
        chmod +x ./gradlew
        # 複数タスクを空白区切りで受け取るため意図的にクォートしない
        # shellcheck disable=SC2086
        ./gradlew $GRADLE_COMMAND
